name: amdtop
base: core22
version: '1.1.1'
summary: AMD GPU monitoring tool with efficiency metrics
description: |
  A robust task monitor for AMD GPUs with advanced efficiency metrics.
  It provides detailed information about GPU utilization, effective load (efficiency),
  memory usage (VRAM/GTT), temperature, and running processes using specific AMD
  sysfs interfaces. The efficiency metric combines GPU utilization with power
  consumption for more accurate workload assessment.

# --- 新增的元数据 (解决 Lint 警告) ---
title: AMDTOP
license: GPL-3.0+
contact: https://github.com/HUSRCF/amdtop/issues
website: https://github.com/HUSRCF/amdtop
source-code: https://github.com/HUSRCF/amdtop
issues: https://github.com/HUSRCF/amdtop/issues
donation: https://github.com/HUSRCF/amdtop

grade: stable
confinement: strict

apps:
  amdtop:
    # --- 关键修改：从 bin/amdtop 改为 usr/bin/amdtop ---
    command: usr/bin/amdtop
    plugs:
      - system-observe
      - hardware-observe
      - mount-observe
      - home
      - opengl
      - process-control # 有时杀进程需要这个

parts:
  amdtop:
    plugin: cmake
    source: .
    # 强制指定安装路径为 /usr (确保文件一定在 usr/bin 下)
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DAMDGPU_SUPPORT=ON
      - -DNVIDIA_SUPPORT=OFF
      - -DINTEL_SUPPORT=ON
      - -DROCM_SMI_SUPPORT=ON
    build-packages:
      - libncurses-dev
      - libudev-dev
      - libsystemd-dev
      - libdrm-dev
      - pkg-config
      - build-essential
    stage-packages:
      - libncurses6
      - libudev1
      - libsystemd0
      - libdrm2
      - libdrm-amdgpu1
